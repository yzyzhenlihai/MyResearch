env: KuaiEnv-v0
user_model_name: DeepFM
read_message: pointneg
seed: 2023
cpu: true
cuda: 0
cuda_visible_devices: 2
is_userinfo: false
random_init: true

analysis_data_source: policy_rollout
policy_checkpoint_path: saved_models/KuaiEnv-v0/DORL/DORL_DORL_ckpt_20260324_gpu2-e89.pt
policy_checkpoint_dir: saved_models/KuaiEnv-v0/DORL
policy_allow_random_init_for_rollout: false
policy_rollout_n_steps: 2048
policy_rollout_env_num: 32
policy_deterministic_eval: false
policy_remove_recommended_ids: false

primary_uncertainty_source: ensemble_disagreement
uncertainty_source: ensemble_disagreement
appendix_uncertainty_sources: [variance_head]
oracle_reward_for_error: watch_ratio_normed
oracle_reward_for_ranking: watch_ratio_normed
decision_cost_reward: watch_ratio
cost_primary_risk: local_pairwise_flip

topk: 20
shortlist_topl: 100
evaluation_slice: shortlist_union
pairwise_mode: local_topl
bucket_count: 10
high_error_quantile: 0.8
high_flip_quantile: 0.8
support_quantiles: [0.2, 0.8]
support_quantile_mode: per_user
margin_quantiles: [0.2, 0.8]
margin_quantile_mode: per_user
conditional_support_slice: small_margin

cost_lambdas: [0.1, 0.2, 0.5, 1.0]
cost_compare_modes: [soft_penalty, hard_mask]
cost_budget_quantiles: [0.05, 0.10, 0.20]
exposure_weight_scheme: log_discount

output_dir: results/motivation_kuairec_dorl_v3_policy_e89_stochastic
baseline_results_dir: results/motivation_kuairec_dorl_v2_full
run_subset_ablation: false
subset_ablation_output_dir: results/motivation_kuairec_dorl_v3_policy_e89_stochastic_ablation
ablation_max_users: 64
ablation_subset_items: 512
max_users: 0
subset_items: 0
smoke_test: false

verify_ood: true
big_chunksize: 2000000
knn_k: 20
tau_support: auto

forward_check_users: 3
forward_check_items: 64
forward_allclose_atol: 1.0e-5
ensemble_user_batch_size: 32
ensemble_eval_batch_size: 8192

run_rollout_return: false
training_log_path: saved_models/KuaiEnv-v0/DORL/logs/[DORL_ckpt_20260324_gpu2]_2026_03_24-03_18_45.log
training_best_epoch: 89
training_best_reward: 28.326765417159308
training_command: >-
  CUDA_VISIBLE_DEVICES=2 PYTHONPATH=.:./src:./src/DeepCTR-Torch MPLCONFIGDIR=/tmp/mpl SWANLAB_MODE=offline
  conda run -n easyrl4rec python examples/advance/run_DORL.py
  --env KuaiEnv-v0 --user_model_name DeepFM --read_message pointneg --seed 2023
  --cuda 0 --is_save --which_tracker avg --window_size 3 --epoch 100
  --batch-size 1024 --hidden-sizes 64 64 --leave_threshold 0 --num_leave_compute 1
  --max_turn 30 --force_length 10 --lambda_entropy 0.05 --lambda_variance 0.01
  --message DORL_ckpt_20260324_gpu2
